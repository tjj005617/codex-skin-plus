<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Skin Plus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0f;
      --bg-card: #12121a;
      --bg-hover: #1a1a25;
      --border: #2a2a35;
      --text: #e8e0d0;
      --text-dim: #888898;
      --accent: #e8b84b;
      --accent-dim: rgba(232, 184, 75, 0.15);
      --success: #7ec8a0;
      --error: #e8a0b0;
    }
    body {
      font-family: "Segoe UI Variable", "Microsoft YaHei UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(10, 10, 15, 0.95);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 16px; color: var(--accent); }
    .layout { display: flex; min-height: calc(100vh - 57px); }
    .sidebar {
      width: 200px;
      background: rgba(12, 12, 18, 0.95);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      position: sticky;
      top: 57px;
      height: calc(100vh - 57px);
      overflow-y: auto;
    }
    .sidebar-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-item:hover { background: var(--bg-hover); color: var(--text); }
    .sidebar-item.active { background: var(--accent-dim); color: var(--accent); }
    .sidebar-item svg { width: 18px; height: 18px; }
    .content { flex: 1; padding: 24px; }
    .page { display: none; }
    .page.active { display: block; }
    h2 { font-size: 18px; margin-bottom: 20px; }
    .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .theme-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }
    .theme-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .theme-card.active { border-color: var(--accent); box-shadow: 0 0 20px rgba(232, 184, 75, 0.2); }
    .theme-preview {
      height: 120px;
      background: linear-gradient(135deg, #1a1a25, #0a0a15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--text-dim);
      position: relative;
      overflow: hidden;
    }
    .theme-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .theme-type {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.7);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    .theme-info { padding: 12px; }
    .theme-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .theme-meta { font-size: 12px; color: var(--text-dim); }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #0a0a0f; }
    .btn-primary:hover { background: #d4a640; }
    .btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg-hover); }
    .btn-danger { background: rgba(232,160,176,0.15); color: var(--error); }
    .btn-danger:hover { background: rgba(232,160,176,0.25); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .form-group input:focus { border-color: var(--accent); }
    .color-row { display: flex; gap: 12px; align-items: center; }
    .color-row input[type="color"] { width: 40px; height: 40px; padding: 2px; cursor: pointer; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; }
    .color-row input[type="text"] { flex: 1; }
    .btn-row { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
    .palette-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      z-index: 1000;
      transform: translateX(120%);
      transition: transform 0.3s;
    }
    .toast.show { transform: translateX(0); }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--error); color: var(--error); }
    .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      margin-left: 8px;
    }
    .badge.active { background: var(--accent-dim); color: var(--accent); }
    .badge.inactive { background: var(--bg-hover); color: var(--text-dim); }
  </style>
</head>
<body>
  <div class="header">
    <h1>Codex Skin Plus Manager</h1>
    <span style="font-size:12px;color:var(--text-dim)">http://localhost:30200</span>
  </div>
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-item active" data-page="themes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        Themes
      </div>
      <div class="sidebar-item" data-page="create">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Create
      </div>
      <div class="sidebar-item" data-page="palette">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="10.5" r="2.5"/><circle cx="8.5" cy="7.5" r="2.5"/><circle cx="6.5" cy="12.5" r="2.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
        Palette
      </div>
      <div class="sidebar-item" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </div>
    </div>
    <div class="content">
      <div class="page active" id="themes">
        <div class="actions-bar">
          <h2>Available Themes <span id="themeCount" class="badge inactive">0</span></h2>
          <button class="btn btn-secondary" onclick="loadThemes()">Refresh</button>
        </div>
        <div class="theme-grid" id="themeGrid"></div>
      </div>
      <div class="page" id="create">
        <h2>Create New Theme</h2>
        <div class="form-group">
          <label>Theme Name</label>
          <input type="text" id="newThemeName" placeholder="My Custom Theme">
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="newThemeType">
            <option value="video">Video Wallpaper (.mp4/.webm)</option>
            <option value="image">Image Wallpaper (.jpg/.png/.webp)</option>
          </select>
        </div>
        <div class="form-group">
          <label>File Path (absolute path on disk)</label>
          <input type="text" id="newThemeFile" placeholder="D:\wallpapers\my-video.mp4">
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="createTheme()">Create Theme</button>
        </div>
      </div>
      <div class="page" id="palette">
        <h2>Customize Palette</h2>
        <div class="form-group">
          <label>Select Theme</label>
          <select id="paletteThemeSelect" onchange="loadPalette()"></select>
        </div>
        <div class="palette-grid">
          <div class="form-group">
            <label>Text Color (ink)</label>
            <div class="color-row">
              <input type="color" id="pal-ink" onchange="syncColor('ink')">
              <input type="text" id="pal-ink-text" value="#E8E0D0">
            </div>
          </div>
          <div class="form-group">
            <label>Accent Color</label>
            <div class="color-row">
              <input type="color" id="pal-accent" onchange="syncColor('accent')">
              <input type="text" id="pal-accent-text" value="#E8B84B">
            </div>
          </div>
          <div class="form-group">
            <label>Background (surface)</label>
            <div class="color-row">
              <input type="color" id="pal-surface" onchange="syncColor('surface')">
              <input type="text" id="pal-surface-text" value="#0F1320">
            </div>
          </div>
          <div class="form-group">
            <label>Contrast (0-100)</label>
            <input type="number" id="pal-contrast" min="0" max="100" value="50">
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="savePalette()">Save</button>
          <button class="btn btn-secondary" onclick="saveAndApply()">Save & Apply</button>
        </div>
      </div>
      <div class="page" id="settings">
        <h2>Settings</h2>
        <div class="form-group">
          <label>Codex Installation Path</label>
          <input type="text" id="settingCodexPath" placeholder="E:\codex\Codex">
        </div>
        <div class="form-group">
          <label>Debug Port</label>
          <input type="number" id="settingPort" value="30123">
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="saveSettings()">Save</button>
          <button class="btn btn-danger" onclick="restoreOriginal()">Remove Skin</button>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    let themes = [];
    let currentConfig = {};

    document.querySelectorAll('.sidebar-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        item.classList.add('active');
        document.getElementById(item.dataset.page).classList.add('active');
      });
    });

    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast ' + type;
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    async function api(url, method, data) {
      const opts = { method: method || 'GET', headers: { 'Content-Type': 'application/json' } };
      if (data) opts.body = JSON.stringify(data);
      const res = await fetch(url, opts);
      return res.json();
    }

    async function loadThemes() {
      themes = await api('/api/themes');
      currentConfig = await api('/api/config');
      renderThemes();
      updatePaletteSelect();
      document.getElementById('themeCount').textContent = themes.length;
    }

    function renderThemes() {
      const grid = document.getElementById('themeGrid');
      grid.innerHTML = themes.map(t => `
        <div class="theme-card ${t.id === currentConfig.currentTheme ? 'active' : ''}" onclick="applyTheme('${t.id}')">
          <div class="theme-preview">
            ${'<img src="/api/preview/' + t.id + '" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22120%22><rect fill=%22%231a1a25%22 width=%22300%22 height=%22120%22/><text fill=%22%23888898%22 font-family=%22sans-serif%22 font-size=%2214%22 x=%22150%22 y=%2265%22 text-anchor=%22middle%22>' + t.type.toUpperCase() + '</text></svg>\'">'}
            <span class="theme-type">${t.type}</span>
          </div>
          <div class="theme-info">
            <div class="theme-name">${t.name} ${t.id === currentConfig.currentTheme ? '<span class="badge active">Active</span>' : ''}</div>
            <div class="theme-meta">${t.hasFile ? 'Ready' : 'Missing file'}</div>
          </div>
        </div>
      `).join('');
    }

    async function applyTheme(id) {
      const result = await api('/api/apply', 'POST', { themeId: id });
      if (result.ok) {
        showToast('Theme applied!', 'success');
        currentConfig.currentTheme = id;
        renderThemes();
      } else {
        showToast(result.error, 'error');
      }
    }

    async function createTheme() {
      const name = document.getElementById('newThemeName').value;
      const type = document.getElementById('newThemeType').value;
      const filePath = document.getElementById('newThemeFile').value;
      if (!name || !filePath) { showToast('Please fill all fields', 'error'); return; }
      const result = await api('/api/create', 'POST', { name, filePath, type });
      if (result.ok) {
        showToast('Theme created!', 'success');
        document.getElementById('newThemeName').value = '';
        document.getElementById('newThemeFile').value = '';
        loadThemes();
      } else {
        showToast(result.error, 'error');
      }
    }

    function updatePaletteSelect() {
      const select = document.getElementById('paletteThemeSelect');
      select.innerHTML = themes.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
      if (themes.length > 0) loadPalette();
    }

    function loadPalette() {
      const id = document.getElementById('paletteThemeSelect').value;
      const theme = themes.find(t => t.id === id);
      if (!theme) return;
      const p = theme.palette;
      document.getElementById('pal-ink').value = p.ink;
      document.getElementById('pal-ink-text').value = p.ink;
      document.getElementById('pal-accent').value = p.accent;
      document.getElementById('pal-accent-text').value = p.accent;
      document.getElementById('pal-surface').value = p.surface;
      document.getElementById('pal-surface-text').value = p.surface;
      document.getElementById('pal-contrast').value = p.contrast;
    }

    function syncColor(field) {
      document.getElementById('pal-' + field + '-text').value = document.getElementById('pal-' + field).value;
    }

    async function savePalette() {
      const id = document.getElementById('paletteThemeSelect').value;
      const palette = {
        ink: document.getElementById('pal-ink-text').value,
        accent: document.getElementById('pal-accent-text').value,
        surface: document.getElementById('pal-surface-text').value,
        contrast: parseInt(document.getElementById('pal-contrast').value),
      };
      const result = await api('/api/palette', 'POST', { themeId: id, palette });
      if (result.ok) showToast('Saved!', 'success');
      else showToast(result.error, 'error');
    }

    async function saveAndApply() {
      await savePalette();
      const id = document.getElementById('paletteThemeSelect').value;
      await applyTheme(id);
    }

    async function loadSettings() {
      currentConfig = await api('/api/config');
      document.getElementById('settingCodexPath').value = currentConfig.codexPath || '';
      document.getElementById('settingPort').value = currentConfig.port || 30123;
    }

    async function saveSettings() {
      currentConfig.codexPath = document.getElementById('settingCodexPath').value;
      currentConfig.port = parseInt(document.getElementById('settingPort').value);
      await api('/api/config', 'POST', currentConfig);
      showToast('Saved!', 'success');
    }

    async function restoreOriginal() {
      if (!confirm('Remove skin?')) return;
      await api('/api/restore', 'POST');
      currentConfig.currentTheme = null;
      renderThemes();
      showToast('Removed. Restart Codex.', 'success');
    }

    loadThemes();
    loadSettings();
  </script>
</body>
</html>
